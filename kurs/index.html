<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unlimited You 1.0 — 1 oy, 10 ta grant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#141217;--bg2:#1C1922;--card:#221F29;--line:#34303D;--pink:#FF5FA2;--pink2:#3A1F2E;--lime:#C9F45B;--lime2:#2A3318;--text:#F3EFF6;--muted:#A9A2B4;--danger:#FF7A6B;--r:22px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.5}
a{color:inherit}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--pink)}
textarea{min-height:120px;resize:vertical}
label{display:block;font-size:14px;color:var(--muted);margin:14px 0 6px;font-weight:600}
h1,h2,h3{font-family:Poppins,sans-serif;letter-spacing:-.02em;line-height:1.15}
.script{font-family:Pacifico,cursive;font-weight:400;color:var(--pink);letter-spacing:0}
.muted{color:var(--muted)}
.hide{display:none!important}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* brand */
.brand{display:flex;align-items:center;gap:10px;font-family:Poppins,sans-serif;font-weight:800;font-size:22px;letter-spacing:-.03em}
.brand .script{font-size:24px}
.brand .ver{background:var(--lime);color:#16141A;font-size:13px;border-radius:8px;padding:2px 8px;font-family:Poppins}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:13px 22px;font-weight:700;background:var(--pink);color:#1A1418;transition:transform .15s,opacity .15s}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn.lime{background:var(--lime);color:#16141A}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.sm{padding:8px 14px;font-size:14px}
.btn.full{width:100%}

/* auth */
.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.auth-l{padding:56px;display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(circle at 20% 20%,#3A1F2E 0,transparent 55%),radial-gradient(circle at 80% 90%,#2A3318 0,transparent 50%),var(--bg)}
.auth-l h1{font-size:clamp(44px,6vw,88px);font-weight:800;margin:40px 0 20px}
.auth-l p{font-size:19px;color:var(--muted);max-width:520px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.chip{border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;color:var(--muted)}
.auth-r{display:flex;align-items:center;justify-content:center;padding:40px 24px;background:var(--bg2)}
.auth-box{width:100%;max-width:420px}
.tabs{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:5px;margin-bottom:22px}
.tabs button{flex:1;padding:10px;border-radius:999px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--card);color:var(--text)}
.err{color:var(--danger);font-size:14px;margin-top:12px;min-height:20px}
.codebox{background:var(--lime);color:#16141A;border-radius:var(--r);padding:24px;text-align:center;margin:18px 0}
.codebox b{font-family:Poppins;font-size:44px;letter-spacing:6px;display:block}

/* app layout */
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{background:var(--bg2);border-right:1px solid var(--line);padding:28px 18px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.side .brand{margin:0 10px 28px}
.nav{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;color:var(--muted);font-weight:600;width:100%;text-align:left}
.nav:hover{background:var(--card);color:var(--text)}
.nav.on{background:var(--card);color:var(--text)}
.nav.on svg{color:var(--pink)}
.side .spacer{flex:1}
.main{padding:40px 48px 80px;max-width:1180px;width:100%}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:28px;flex-wrap:wrap}
.top h2{font-size:38px;font-weight:800}
.kick{font-size:13px;font-weight:700;letter-spacing:3px;color:var(--lime);text-transform:uppercase;margin-bottom:8px}

.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.card h3{font-size:20px;margin-bottom:6px}
.stat .v{font-family:Poppins;font-size:40px;font-weight:800;line-height:1.1;margin:6px 0 2px}
.stat .l{color:var(--muted);font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.stat.pink{background:var(--pink);border-color:var(--pink);color:#1A1418}
.stat.pink .l{color:#3A1F2E}
.stat.lime{background:var(--lime);border-color:var(--lime);color:#16141A}
.stat.lime .l{color:#2A3318}

.bar{height:10px;background:var(--bg);border-radius:99px;overflow:hidden;margin-top:12px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--lime));border-radius:99px}

/* roadmap */
.road{display:grid;grid-template-columns:repeat(10,1fr);gap:8px;margin-top:18px}
.node{border-radius:16px;padding:12px 8px;text-align:center;border:1px solid var(--line);background:var(--bg);font-size:12px;color:var(--muted);cursor:pointer;min-height:96px;display:flex;flex-direction:column;align-items:center;gap:6px}
.node b{font-family:Poppins;font-size:20px;color:var(--text)}
.node.done{background:var(--lime2);border-color:var(--lime);color:var(--lime)}
.node.open{border-color:var(--pink);color:var(--pink)}
.node.lock{opacity:.5;cursor:default}

/* lessons */
.lesson{display:flex;gap:20px;align-items:center;cursor:pointer;transition:border-color .15s}
.lesson:hover{border-color:var(--pink)}
.lesson .n{width:60px;height:60px;border-radius:18px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-family:Poppins;font-weight:800;font-size:24px;flex-shrink:0}
.lesson.lock{cursor:default;opacity:.55}
.lesson.lock:hover{border-color:var(--line)}
.lesson .body{flex:1;min-width:0}
.lesson .meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;border-radius:999px;padding:4px 12px;background:var(--bg);color:var(--muted)}
.tag.ok{background:var(--lime2);color:var(--lime)}
.tag.wait{background:var(--pink2);color:var(--pink)}
.tag.re{background:#3A2420;color:var(--danger)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,9,12,.72);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:50}
.sheet{background:var(--bg2);border:1px solid var(--line);border-radius:28px;max-width:760px;width:100%;padding:32px;position:relative}
.sheet .x{position:absolute;right:18px;top:18px;width:40px;height:40px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center}
.hw{white-space:pre-wrap;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:10px;line-height:1.6}
.fb{background:var(--lime2);border:1px solid var(--lime);border-radius:18px;padding:18px;margin-top:14px}
.fb.re{background:#3A2420;border-color:var(--danger)}
.drop{border:2px dashed var(--line);border-radius:18px;padding:20px;text-align:center;color:var(--muted);cursor:pointer}
.drop:hover{border-color:var(--pink);color:var(--text)}

/* leaderboard */
.lb-row{display:flex;align-items:center;gap:16px;padding:14px 18px;border-bottom:1px solid var(--line)}
.lb-row:last-child{border-bottom:none}
.lb-row .rk{width:38px;height:38px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-family:Poppins;font-weight:800}
.lb-row.me{background:var(--pink2);border-radius:16px}
.lb-row .pts{margin-left:auto;font-family:Poppins;font-weight:800;font-size:20px}
.podium .rk{background:var(--lime);color:#16141A}

.res{display:flex;gap:14px;align-items:flex-start;text-decoration:none}
.res:hover{border-color:var(--lime)}
.res .ic{width:44px;height:44px;border-radius:14px;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--lime);flex-shrink:0}

table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--lime);font-weight:700;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.scroll{overflow-x:auto}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--lime);color:#16141A;padding:12px 22px;border-radius:999px;font-weight:700;z-index:99}
.loading{display:flex;align-items:center;justify-content:center;min-height:100vh;color:var(--muted)}

.mob-nav{display:none}
@media (max-width:900px){
  .auth{grid-template-columns:1fr}.auth-l{padding:32px 24px}.auth-l h1{margin:24px 0 12px}
  .app{grid-template-columns:1fr}.side{display:none}
  .main{padding:24px 18px 110px}
  .g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}
  .road{grid-template-columns:repeat(5,1fr)}
  .top h2{font-size:30px}
  .mob-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:40}
  .mob-nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);padding:6px 0;font-weight:600}
  .mob-nav button.on{color:var(--pink)}
  .stat .v{font-size:30px}
  .sheet{padding:24px 18px}
}
</style>
</head>
<body>

<script>
// ===== Sozlamalar =====
const SUPABASE_URL = "https://wccuqbmbhkctgngcwwer.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndjY3VxYm1iaGtjdGduZ2N3d2VyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ5MTk2ODgsImV4cCI6MjExMDQ5NTY4OH0.m9NBK4ZcBfJujiTy7Zx5VVLIlpJt9btnG5xjsDNsUtA";
const BUCKET = "course-hw";
const TELEGRAM = "https://t.me/nasir_sevinch";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false } });
const root = document.getElementById("root");

// ===== Ikonkalar (SVG) =====
const P = {
  home:'<path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/>',
  book:'<path d="M4 4h10a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4z"/><path d="M4 16a4 4 0 0 1 4-4h10"/>',
  trophy:'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>',
  link:'<path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>',
  logout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  star:'<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/>',
  lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  play:'<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>',
  upload:'<path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>',
  file:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  send:'<path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/>',
  flag:'<path d="M4 22V4M4 4h13l-2 4 2 4H4"/>'
};
const ic = (n, s) => `<svg class="i" viewBox="0 0 24 24" ${s?`style="width:${s}px;height:${s}px"`:""}>${P[n]||""}</svg>`;

// ===== Yordamchilar =====
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https?:\/\//i.test(u||"") ? esc(u) : "#";
const fmtDate = d => d ? new Date(d).toLocaleString("uz-UZ",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit",timeZone:"Asia/Tashkent"}) : "—";
const store = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}, del(k){try{localStorage.removeItem(k)}catch(e){}} };
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
const ERR = {
  SESSION:"Sessiya tugadi yoki boshqa qurilmadan kirildi. Kodingiz bilan qayta kiring.",
  JOIN_CODE:"Kurs kodi noto'g'ri. Kodni ustozingizdan oling.",
  NAME:"Ism-familiyani to'liq yozing.",
  PHONE_EXISTS:"Bu raqam bilan avval ro'yxatdan o'tilgan. Kirish kodingiz bilan kiring.",
  CODE:"Kirish kodi topilmadi. Tekshirib qayta yozing.",
  LESSON:"Bu dars hali ochilmagan.",
  EMPTY:"Javob, havola yoki fayldan kamida bittasini qo'shing.",
  GRADED:"Bu vazifa baholangan, uni o'zgartirib bo'lmaydi.",
  TOO_LONG:"Javob juda uzun.",
  FILE:"Fayl manzili noto'g'ri.",
  ADMIN_PASS:"Parol noto'g'ri.",
  ADMIN:"Admin sessiyasi tugadi. Qayta kiring.",
  POINTS:"Ball noto'g'ri kiritildi.",
  PASS_SHORT:"Parol kamida 8 belgidan iborat bo'lsin.",
  LESSON_FIELDS:"Dars raqami va nomini kiriting.",
  RES_FIELDS:"Nom va https:// bilan boshlanadigan havolani kiriting."
};
function errText(e){const m=(e&&e.message)||"";for(const k in ERR){if(m.includes(k))return ERR[k]}return "Xatolik yuz berdi. Internetni tekshirib, qayta urinib ko'ring."}
async function rpc(fn, args){const {data,error}=await sb.rpc(fn,args);if(error)throw error;return data}
function level(t){
  if(t>=90) return {name:"Unlimited",next:null};
  if(t>=50) return {name:"Grant ovchisi",next:90};
  if(t>=20) return {name:"Izlanuvchi",next:50};
  return {name:"Boshlovchi",next:20};
}

// ===== Holat =====
let S = { token: store.get("uy_token"), data:null, view:"home", authTab:"login", lessonOpen:null };

// ===== Kirish ekrani =====
function renderAuth(newCode){
  root.innerHTML = `
  <div class="auth">
    <div class="auth-l">
      <div class="brand">unlimited <span class="script">you</span><span class="ver">1.0</span></div>
      <div>
        <p class="kick">1 oy · 10 ta grant</p>
        <h1>Grantga yo'lingiz <span class="script">shu yerda</span></h1>
        <p>Darslar prezentatsiyasi, uy vazifalari, ballar va reyting — hammasi bitta joyda.</p>
        <div class="chips">${["Erasmus+","Erasmus Mundus","DAAD","NSP","Stipendium Hungaricum","Chevening","Konferensiyalar"].map(c=>`<span class="chip">${c}</span>`).join("")}</div>
      </div>
      <p class="muted" style="font-size:14px">Sevinch Nasirullayeva · @nasirullaevasevinch</p>
    </div>
    <div class="auth-r"><div class="auth-box">
      ${newCode ? `
        <h2 style="font-size:30px">Xush kelibsiz!</h2>
        <p class="muted" style="margin-top:8px">Bu sizning shaxsiy kirish kodingiz. Uni saqlab qo'ying — keyingi safar shu kod bilan kirasiz.</p>
        <div class="codebox"><span style="font-weight:700">Kirish kodi</span><b>${esc(newCode)}</b></div>
        <button class="btn ghost full" id="copyCode">Kodni nusxalash</button>
        <button class="btn full" style="margin-top:10px" id="goIn">Platformaga kirish</button>
      ` : `
        <div class="tabs"><button data-t="login" class="${S.authTab==="login"?"on":""}">Kirish</button><button data-t="reg" class="${S.authTab==="reg"?"on":""}">Ro'yxatdan o'tish</button></div>
        ${S.authTab==="login" ? `
          <h2 style="font-size:28px">Qaytganingizdan xursandmiz</h2>
          <form id="fLogin">
            <label>Shaxsiy kirish kodi</label>
            <input id="code" placeholder="Masalan: K7M2QX" maxlength="6" autocomplete="off" style="text-transform:uppercase;letter-spacing:4px;font-weight:700">
            <button class="btn full" style="margin-top:18px">Kirish</button>
            <p class="err" id="err"></p>
          </form>
          <p class="muted" style="font-size:14px">Kodni unutdingizmi? Ustozingizga yozing: <a href="${TELEGRAM}" target="_blank" rel="noopener">${TELEGRAM.replace("https://","")}</a></p>
        ` : `
          <h2 style="font-size:28px">Kursga qo'shiling</h2>
          <form id="fReg">
            <label>Ism va familiya</label><input id="name" placeholder="Ism Familiya" maxlength="80">
            <label>Telefon raqam</label><input id="phone" placeholder="+998 90 123 45 67" inputmode="tel">
            <label>Telegram (ixtiyoriy)</label><input id="tg" placeholder="@username">
            <label>Kurs kodi</label><input id="join" placeholder="Ustozdan olingan kod" autocomplete="off" style="text-transform:uppercase">
            <button class="btn full" style="margin-top:18px">Ro'yxatdan o'tish</button>
            <p class="err" id="err"></p>
          </form>
        `}
      `}
    </div></div>
  </div>`;
  if(newCode){
    document.getElementById("copyCode").onclick=async()=>{try{await navigator.clipboard.writeText(newCode);toast("Kod nusxalandi")}catch(e){toast("Kodni yozib oling: "+newCode)}};
    document.getElementById("goIn").onclick=()=>boot();
    return;
  }
  root.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{S.authTab=b.dataset.t;renderAuth()});
  const f = document.getElementById(S.authTab==="login"?"fLogin":"fReg");
  f.onsubmit = async ev => {
    ev.preventDefault();
    const btn=f.querySelector("button"), err=document.getElementById("err"); btn.disabled=true; err.textContent="";
    try{
      if(S.authTab==="login"){
        const r = await rpc("course_login",{p_code:document.getElementById("code").value});
        S.token=r.token; store.set("uy_token",r.token); boot();
      } else {
        const r = await rpc("course_register",{p_name:document.getElementById("name").value,p_phone:document.getElementById("phone").value.replace(/\s/g,""),p_telegram:document.getElementById("tg").value,p_join_code:document.getElementById("join").value});

function statusTag(l){
  if(!l.is_open) return `<span class="tag">${ic("lock",14)} Tez kunda</span>`;
  const s=l.sub;
  if(!s) return `<span class="tag wait">${ic("clock",14)} Vazifa kutilmoqda</span>`;
  if(s.status==="tekshirildi") return `<span class="tag ok">${ic("check",14)} ${s.points}/${l.max_points} ball</span>`;
  if(s.status==="qayta") return `<span class="tag re">Qayta topshiring</span>`;
  return `<span class="tag">${ic("send",14)} Tekshiruvda</span>`;
}

function openLesson(id){
  const l=S.data.lessons.find(x=>x.id==id); if(!l) return; S.lessonOpen=id;
  const s=l.sub, graded=s&&s.status==="tekshirildi";
  const m=document.getElementById("modal");
  m.innerHTML=`<div class="modal" id="mbg"><div class="sheet">
    <button class="x" id="mx" aria-label="Yopish">${ic("x")}</button>
    <p class="kick">${l.num}-dars · ${esc(l.program||"")}</p>
    <h2 style="font-size:30px;padding-right:40px">${esc(l.title)}</h2>
    ${l.description?`<p class="muted" style="margin-top:10px">${esc(l.description)}</p>`:""}
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px">
      ${l.slides_url?`<a class="btn" href="${safeUrl(l.slides_url)}" target="_blank" rel="noopener">${ic("play")} Prezentatsiyani ochish</a>`:`<span class="tag">Prezentatsiya hali yuklanmagan</span>`}
      ${l.extra_url?`<a class="btn ghost" href="${safeUrl(l.extra_url)}" target="_blank" rel="noopener">${ic("link")} Qo'shimcha material</a>`:""}
    </div>
    ${l.homework?`<h3 style="margin-top:28px">Uy vazifasi</h3>
      <p class="muted" style="font-size:14px">${l.deadline?"Muddat: "+fmtDate(l.deadline)+" · o'z vaqtida topshirsangiz +2 ball":"Muddat belgilanmagan"} · maksimal ${l.max_points} ball</p>
      <div class="hw">${esc(l.homework)}</div>`:""}
    ${s&&s.feedback||graded?`<div class="fb ${s.status==="qayta"?"re":""}"><p style="font-weight:700">${graded?`Baho: ${s.points}/${l.max_points}`:"Qayta topshirish so'raldi"}</p>${s.feedback?`<p style="white-space:pre-wrap;margin-top:6px">${esc(s.feedback)}</p>`:""}</div>`:""}
    ${l.homework?(graded?`<div class="hw" style="margin-top:14px"><p class="muted" style="font-size:13px">Sizning javobingiz</p>${s.answer?`<p>${esc(s.answer)}</p>`:""}${s.link?`<p><a href="${safeUrl(s.link)}" target="_blank" rel="noopener">${esc(s.link)}</a></p>`:""}${s.file_url?`<p><a href="${safeUrl(s.file_url)}" target="_blank" rel="noopener">${esc(s.file_name||"Fayl")}</a></p>`:""}</div>`:`
      <h3 style="margin-top:28px">${s?"Javobingizni yangilash":"Javob yuborish"}</h3>
      ${s?`<p class="muted" style="font-size:14px">Oxirgi yuborilgan: ${fmtDate(s.submitted_at)}</p>`:""}
      <form id="fSub">
        <label>Javob matni</label><textarea id="ans" placeholder="Javobingizni shu yerga yozing…">${esc(s?.answer||"")}</textarea>
        <label>Havola (Google Docs, Drive, Canva…)</label><input id="lnk" placeholder="https://" value="${esc(s?.link||"")}">
        <label>Fayl (PDF, Word, rasm — 10 MB gacha)</label>
        <div class="drop" id="drop">${ic("upload")} <span id="fname">${s?.file_name?"Joriy fayl: "+esc(s.file_name)+" · almashtirish uchun bosing":"Faylni tanlang yoki shu yerga tashlang"}</span></div>
        <input type="file" id="file" class="hide" accept=".pdf,.doc,.docx,.ppt,.pptx,.xlsx,.png,.jpg,.jpeg,.webp,.txt">
        <button class="btn full" style="margin-top:18px" id="sbtn">${ic("send")} ${s?"Yangilash":"Yuborish"}</button>
        <p class="err" id="serr"></p>
      </form>`):""}
  </div></div>`;
  const close=()=>{S.lessonOpen=null;m.innerHTML=""};
  document.getElementById("mx").onclick=close;
  document.getElementById("mbg").onclick=e=>{if(e.target.id==="mbg")close()};
  const f=document.getElementById("fSub"); if(!f) return;
  let file=null; const fi=document.getElementById("file"), drop=document.getElementById("drop");
  const pick=x=>{if(!x)return;if(x.size>10*1024*1024){document.getElementById("serr").textContent="Fayl 10 MB dan katta.";return}file=x;document.getElementById("fname").textContent=x.name};
  drop.onclick=()=>fi.click(); fi.onchange=()=>pick(fi.files[0]);
  drop.ondragover=e=>{e.preventDefault();drop.style.borderColor="var(--pink)"}; drop.ondragleave=()=>drop.style.borderColor="";
  drop.ondrop=e=>{e.preventDefault();drop.style.borderColor="";pick(e.dataTransfer.files[0])};
  f.onsubmit=async ev=>{
    ev.preventDefault(); const b=document.getElementById("sbtn"), er=document.getElementById("serr"); b.disabled=true; er.textContent="";
    try{
      let url=null,name=null;
      if(file){
        b.textContent="Fayl yuklanmoqda…";
        const ext=(file.name.split(".").pop()||"bin").toLowerCase().replace(/[^a-z0-9]/g,"");
        const path=`l${l.num}/${crypto.randomUUID()}.${ext}`;
        const {error}=await sb.storage.from(BUCKET).upload(path,file,{contentType:file.type||undefined,upsert:false});
        if(error) throw new Error("UPLOAD");
        url=sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl; name=file.name.slice(0,120);
      }
      const r=await rpc("course_submit",{p_token:S.token,p_lesson_id:l.id,p_answer:document.getElementById("ans").value,p_link:document.getElementById("lnk").value,p_file_url:url,p_file_name:name});
      toast(r.on_time?"Yuborildi! O'z vaqtida: +2 ball":"Yuborildi!"); await refresh();
    }catch(e){er.textContent=(e.message==="UPLOAD")?"Faylni yuklab bo'lmadi. Turi va hajmini tekshiring.":errText(e);b.disabled=false;b.innerHTML=ic("send")+" Yuborish"}
  };
}

      <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><h3>${esc(s.student)}</h3><p class="muted" style="font-size:14px">${s.lesson_num}-dars · ${esc(s.lesson_title)} · ${fmtDate(s.submitted_at)} ${s.on_time?"· o'z vaqtida":"· kechikkan"}</p></div>${s.status==="tekshirildi"?`<span class="tag ok">${s.points}/${s.max_points}</span>`:s.status==="qayta"?`<span class="tag re">Qayta</span>`:`<span class="tag wait">Yangi</span>`}</div>
      ${s.answer?`<div class="hw">${esc(s.answer)}</div>`:""}
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px">${s.link?`<a class="btn ghost sm" href="${safeUrl(s.link)}" target="_blank" rel="noopener">${ic("link",16)} Havola</a>`:""}${s.file_url?`<a class="btn ghost sm" href="${safeUrl(s.file_url)}" target="_blank" rel="noopener">${ic("file",16)} ${esc(s.file_name||"Fayl")}</a>`:""}</div>
      <div style="display:grid;grid-template-columns:120px 1fr;gap:12px;margin-top:14px">
        <div><label style="margin-top:0">Ball (0–${s.max_points})</label><input type="number" min="0" max="${s.max_points}" id="p_${s.id}" value="${s.points??""}"></div>
        <div><label style="margin-top:0">Izoh</label><textarea id="f_${s.id}" style="min-height:70px">${esc(s.feedback||"")}</textarea></div>
      </div>
      <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap"><button class="btn lime sm" data-g="${s.id}">${ic("check",16)} Baholash</button><button class="btn ghost sm" data-r="${s.id}">Qayta topshirishni so'rash</button></div>
    </div>`).join(""):`<p class="muted">Bu bo'limda vazifa yo'q.</p>`}</div>`;
  v.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{A.filter=b.dataset.f;renderAdmin()});
  v.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{const id=b.dataset.g;adminCall("course_admin_grade",{p_sub_id:id,p_points:parseInt(document.getElementById("p_"+id).value,10),p_feedback:document.getElementById("f_"+id).value,p_status:"tekshirildi"},"Baholandi")});
  v.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{const id=b.dataset.r;adminCall("course_admin_grade",{p_sub_id:id,p_points:null,p_feedback:document.getElementById("f_"+id).value,p_status:"qayta"},"Qayta topshirish so'raldi")});
}

function aStudents(v,d){
  v.innerHTML=`<div class="top"><div><p class="kick">Ustoz paneli</p><h2>O'quvchilar <span class="muted" style="font-size:22px">${d.students.length}</span></h2></div>
    <div class="card" style="padding:14px 18px"><p class="muted" style="font-size:13px">Ro'yxatdan o'tish uchun kurs kodi</p><p style="font-family:Poppins;font-weight:800;font-size:20px;letter-spacing:2px">${esc(d.join_code)}</p></div></div>
  <div class="card scroll" style="padding:8px"><table><tr><th>#</th><th>Ism</th><th>Kontakt</th><th>Kod</th><th>Vazifa</th><th>Ball</th><th>Bonus berish</th><th></th></tr>
  ${d.students.map(s=>`<tr><td>${s.rank}</td><td><b>${esc(s.name)}</b><br><span class="muted">${fmtDate(s.joined)}</span></td><td>${esc(s.phone||"")}<br><span class="muted">${esc(s.telegram||"")}</span></td><td style="font-family:Poppins;font-weight:700;letter-spacing:2px">${esc(s.code)}</td><td>${s.done}</td><td><b>${s.total}</b><br><span class="muted">vazifa ${s.hw} · vaqt ${s.ontime} · bonus ${s.bonus}</span></td>
    <td style="min-width:240px"><div style="display:flex;gap:6px"><input type="number" id="bp_${s.id}" placeholder="+5" style="width:70px;padding:8px"><input id="br_${s.id}" placeholder="Sabab" style="padding:8px"><button class="btn lime sm" data-b="${s.id}">${ic("plus",16)}</button></div></td>
    <td><button class="btn ghost sm" data-del="${s.id}" data-n="${esc(s.name)}">O'chirish</button></td></tr>`).join("")}</table></div>
  ${d.bonus.length?`<h3 style="margin:26px 0 12px">Berilgan bonuslar</h3><div class="card scroll" style="padding:8px"><table><tr><th>O'quvchi</th><th>Ball</th><th>Sabab</th><th>Sana</th><th></th></tr>${d.bonus.map(b=>`<tr><td>${esc(b.student)}</td><td>${b.points}</td><td>${esc(b.reason||"")}</td><td>${fmtDate(b.at)}</td><td><button class="btn ghost sm" data-bd="${b.id}">Bekor qilish</button></td></tr>`).join("")}</table></div>`:""}`;
  v.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{const id=b.dataset.b;adminCall("course_admin_add_bonus",{p_student:id,p_points:parseInt(document.getElementById("bp_"+id).value,10),p_reason:document.getElementById("br_"+id).value},"Bonus qo'shildi")});
  v.querySelectorAll("[data-bd]").forEach(b=>b.onclick=()=>adminCall("course_admin_delete_bonus",{p_id:parseInt(b.dataset.bd,10)},"Bonus bekor qilindi"));
  v.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>confirmBox(`${b.dataset.n} va uning barcha vazifalari o'chirilsinmi? Buni qaytarib bo'lmaydi.`,()=>adminCall("course_admin_delete_student",{p_id:b.dataset.del},"O'chirildi")));
}

function confirmBox(text,yes){
  const m=document.getElementById("modal");
  m.innerHTML=`<div class="modal"><div class="sheet" style="max-width:440px"><h3>${esc(text)}</h3><div style="display:flex;gap:10px;margin-top:20px"><button class="btn" id="cy">Ha</button><button class="btn ghost" id="cn">Yo'q</button></div></div></div>`;
  document.getElementById("cn").onclick=()=>m.innerHTML=""; document.getElementById("cy").onclick=()=>{m.innerHTML="";yes()};
}

const toLocalInput=iso=>{if(!iso)return"";const d=new Date(new Date(iso).getTime()+5*3600e3);return d.toISOString().slice(0,16)};
const fromLocalInput=v=>v?v+":00+05:00":"";
function aLessons(v,d){
  v.innerHTML=`<div class="top"><div><p class="kick">Ustoz paneli</p><h2>Darslar</h2><p class="muted" style="margin-top:6px">Dars ochilgach o'quvchilar prezentatsiya va vazifani ko'radi. Vaqt — Toshkent vaqti.</p></div><button class="btn" id="addL">${ic("plus")} Yangi dars</button></div>
  <div class="grid">${d.lessons.map(l=>lessonForm(l)).join("")}<div id="newL"></div></div>`;
  document.getElementById("addL").onclick=()=>{document.getElementById("newL").innerHTML=lessonForm({id:null,num:(d.lessons.at(-1)?.num||0)+1,title:"",max_points:10,is_open:false});bindLessonForms(v)};
  bindLessonForms(v);
}
function lessonForm(l){const k=l.id??"new";return `<form class="card" data-lf="${k}">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><h3>${l.id?`${l.num}-dars`:"Yangi dars"}</h3>
  <label style="display:flex;align-items:center;gap:10px;margin:0;color:var(--text)"><input type="checkbox" name="is_open" ${l.is_open?"checked":""} style="width:20px;height:20px"> Ochiq</label></div>
  <div style="display:grid;grid-template-columns:90px 1fr 1fr;gap:12px">
    <div><label>Raqam</label><input name="num" type="number" value="${l.num??""}"></div>
    <div><label>Nomi</label><input name="title" value="${esc(l.title||"")}"></div>
    <div><label>Dastur</label><input name="program" value="${esc(l.program||"")}"></div></div>
  <label>Qisqa tavsif</label><textarea name="description" style="min-height:70px">${esc(l.description||"")}</textarea>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
    <div><label>Prezentatsiya havolasi</label><input name="slides_url" value="${esc(l.slides_url||"")}" placeholder="https://"></div>
    <div><label>Qo'shimcha material havolasi</label><input name="extra_url" value="${esc(l.extra_url||"")}" placeholder="https://"></div></div>
  <label>Uy vazifasi</label><textarea name="homework">${esc(l.homework||"")}</textarea>
  <div style="display:grid;grid-template-columns:1fr 160px;gap:12px">
    <div><label>Muddat</label><input name="deadline" type="datetime-local" value="${toLocalInput(l.deadline)}"></div>
    <div><label>Maks. ball</label><input name="max_points" type="number" value="${l.max_points??10}"></div></div>
  <div style="display:flex;gap:10px;margin-top:16px"><button class="btn lime sm">Saqlash</button>${l.id?`<button type="button" class="btn ghost sm" data-ld="${l.id}">O'chirish</button>`:""}</div></form>`}
function bindLessonForms(v){
  v.querySelectorAll("[data-lf]").forEach(f=>f.onsubmit=e=>{e.preventDefault();const g=n=>f.elements[n].value;
    const p={num:parseInt(g("num"),10),title:g("title").trim(),program:g("program"),description:g("description"),slides_url:g("slides_url").trim(),extra_url:g("extra_url").trim(),homework:g("homework"),deadline:fromLocalInput(g("deadline")),max_points:parseInt(g("max_points"),10)||10,is_open:f.elements.is_open.checked};
    if(f.dataset.lf!=="new")p.id=parseInt(f.dataset.lf,10);
    adminCall("course_admin_save_lesson",{p},"Saqlandi")});
  v.querySelectorAll("[data-ld]").forEach(b=>b.onclick=()=>confirmBox("Dars va unga topshirilgan barcha vazifalar o'chirilsinmi?",()=>adminCall("course_admin_delete_lesson",{p_id:parseInt(b.dataset.ld,10)},"O'chirildi")));
}

function aRes(v,d){
  v.innerHTML=`<div class="top"><div><p class="kick">Ustoz paneli</p><h2>Resurslar</h2></div></div>
  <form class="card" id="fr"><h3>Yangi resurs</h3>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div><label>Nomi</label><input name="title"></div><div><label>Havola</label><input name="url" placeholder="https://"></div></div>
    <div style="display:grid;grid-template-columns:1fr 1fr 120px;gap:12px"><div><label>Bo'lim</label><input name="category" placeholder="Erasmus+, Grantlar, Hujjatlar…"></div><div><label>Izoh</label><input name="note"></div><div><label>Dars №</label><input name="lesson_num" type="number"></div></div>
    <button class="btn lime sm" style="margin-top:16px">${ic("plus",16)} Qo'shish</button></form>
  <div class="card scroll" style="padding:8px;margin-top:18px"><table><tr><th>Bo'lim</th><th>Nomi</th><th>Izoh</th><th>Dars</th><th></th></tr>
  ${d.resources.map(r=>`<tr><td>${esc(r.category)}</td><td><a href="${safeUrl(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a></td><td class="muted">${esc(r.note||"")}</td><td>${r.lesson_num??""}</td><td><button class="btn ghost sm" data-rd="${r.id}">O'chirish</button></td></tr>`).join("")}</table></div>`;
  document.getElementById("fr").onsubmit=e=>{e.preventDefault();const f=e.target;adminCall("course_admin_save_resource",{p:{title:f.title.value,url:f.url.value,category:f.category.value,note:f.note.value,lesson_num:f.lesson_num.value}},"Qo'shildi")};
  v.querySelectorAll("[data-rd]").forEach(b=>b.onclick=()=>adminCall("course_admin_delete_resource",{p_id:parseInt(b.dataset.rd,10)},"O'chirildi"));
}

function aSet(v,d){
  v.innerHTML=`<div class="top"><div><p class="kick">Ustoz paneli</p><h2>Sozlamalar</h2></div></div>
  <form class="card" id="fs" style="max-width:560px">
    <label>Kurs kodi (yangi o'quvchilar ro'yxatdan o'tishi uchun)</label><input name="jc" value="${esc(d.join_code)}" style="text-transform:uppercase">
    <label>Yangi admin parol (o'zgartirmasangiz bo'sh qoldiring)</label><input name="pw" type="password" autocomplete="new-password">
    <button class="btn lime sm" style="margin-top:16px">Saqlash</button>
    <p class="muted" style="font-size:14px;margin-top:14px">Kurs kodini almashtirsangiz, eski kod bilan yangi ro'yxatdan o'tib bo'lmaydi. Ro'yxatdan o'tganlar o'z shaxsiy kodlari bilan kiraveradi.</p>
  </form>`;
  document.getElementById("fs").onsubmit=e=>{e.preventDefault();adminCall("course_admin_settings",{p_join_code:e.target.jc.value,p_new_password:e.target.pw.value},"Saqlandi")};
}

// ===== Ishga tushirish =====
function route(){ if(location.hash==="#admin") adminBoot(); else boot(); }
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
